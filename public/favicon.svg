<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Bron voor alle PWA-icons en tevens de SVG-favicon (pnpm generate-pwa-assets).
       Bewust geen <text>/emoji: sharp heeft geen emoji-font en zou tofu renderen.
       Bewust een dekkende achtergrond over het hele canvas: iOS vult transparantie
       in een apple-touch-icon zwart op, en de maskable-variant snijdt de randen weg. -->
  <rect width="1024" height="1024" fill="#c2683f" />

  <!-- Zon achter de kroon, geeft diepte binnen de maskable safe zone -->
  <circle cx="536" cy="446" r="196" fill="#d1875f" />

